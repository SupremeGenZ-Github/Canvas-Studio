name: Inspect painting sizing APIs
on:
  push:
    branches: [studio-3.1.2]
    paths: ['.github/workflows/inspect-sizing.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect game contracts
        run: |
          curl -fsSL https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar -o game.jar
          javap -p -classpath game.jar net.minecraft.world.entity.decoration.ItemFrame net.minecraft.world.entity.decoration.HangingEntity net.minecraft.world.entity.decoration.BlockAttachedEntity net.minecraft.client.renderer.entity.ItemFrameRenderer net.minecraft.client.renderer.entity.state.ItemFrameRenderState net.minecraft.world.level.storage.ValueInput net.minecraft.world.level.storage.ValueOutput
          javap -c -p -classpath game.jar net.minecraft.world.entity.decoration.ItemFrame > frame.txt
          python3 - <<'PY'
          from pathlib import Path
          for block in Path('frame.txt').read_text().split('\n\n'):
              if any(name in block.split('\n')[0] for name in ['recalculateBoundingBox(', 'survives(', 'setDirection(', 'ItemFrame(']):
                  print(block)
          PY
