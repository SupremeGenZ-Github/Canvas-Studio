name: Living Gallery development checks
on:
  push:
    branches: [studio-3.2]
    paths-ignore: ['.github/workflows/gallery-api.yml', '**.md']
permissions:
  contents: read
concurrency:
  group: studio-3.2-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon | tee build-gallery.log
          python3 verification/ArtifactChecks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-gallery-development
          path: |
            build-gallery.log
            build/libs/*.jar

