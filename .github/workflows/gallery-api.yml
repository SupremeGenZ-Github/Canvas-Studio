name: Inspect Living Gallery APIs
on:
  push:
    branches: [studio-3.2]
    paths: ['.github/workflows/gallery-api.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect Minecraft and NeoForge
        run: |
          curl -fsSL https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar -o game.jar
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/26.3.0.51-beta/neoforge-26.3.0.51-beta-universal.jar -o nf.jar
          jar tf nf.jar | grep -E 'RenderLevelStage|RenderHighlight|RenderGui|Permission|PlayerInteract'
          jar tf game.jar | grep -E 'RenderType|SubmitNodeCollector|SavedDataType|TagValue|Permission' | head -100
          javap -p -classpath game.jar net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.renderer.SubmitNodeCollector\$CustomGeometryRenderer net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.client.renderer.ShapeRenderer net.minecraft.client.renderer.LevelRenderer net.minecraft.client.renderer.state.level.LevelRenderState net.minecraft.client.renderer.state.level.CameraRenderState net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.world.entity.player.Player net.minecraft.server.level.ServerPlayer net.minecraft.world.entity.decoration.Painting net.minecraft.world.entity.decoration.PaintingVariant net.minecraft.world.level.saveddata.SavedData net.minecraft.world.level.saveddata.SavedDataType net.minecraft.world.level.storage.DimensionDataStorage net.minecraft.world.level.saveddata.maps.MapId net.minecraft.world.level.saveddata.maps.MapItemSavedData net.minecraft.world.level.storage.TagValueInput net.minecraft.world.level.storage.TagValueOutput net.minecraft.world.level.storage.ValueInput || true
          javap -p -classpath nf.jar 'net.neoforged.neoforge.client.event.RenderLevelStageEvent' 'net.neoforged.neoforge.client.event.RenderLevelStageEvent$AfterEntities' 'net.neoforged.neoforge.client.event.RenderHighlightEvent$Block' 'net.neoforged.neoforge.client.event.RenderGuiEvent$Post' 'net.neoforged.neoforge.event.entity.player.PlayerInteractEvent$EntityInteract' 'net.neoforged.neoforge.server.permission.PermissionAPI' 'net.neoforged.neoforge.server.permission.nodes.PermissionNode'  || true
          javap -p -classpath game.jar net.minecraft.client.renderer.RenderType net.minecraft.server.players.PlayerList net.minecraft.world.phys.BlockHitResult net.minecraft.client.multiplayer.ClientLevel com.mojang.blaze3d.vertex.VertexConsumer || true
          javap -c -p -classpath game.jar net.minecraft.server.level.ServerEntity > serverentity.txt
          python3 - <<'PY'
          from pathlib import Path
          for block in Path('serverentity.txt').read_text().split('\n\n'):
            if 'sendChanges(' in block.split('\n')[0]:print(block)
          PY
      - name: Inspect relocated and collector APIs
        run: |
          jar tf game.jar | grep -E '/Painting|/painting/|/ShapeRenderer|/DimensionData|RenderType.class'
          javap -p -classpath game.jar net.minecraft.client.renderer.OrderedSubmitNodeCollector net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.world.entity.decoration.painting.Painting net.minecraft.world.entity.decoration.painting.PaintingVariant net.minecraft.world.entity.decoration.ItemFrame net.minecraft.core.Registry net.minecraft.server.MinecraftServer net.minecraft.client.multiplayer.ClientLevel net.minecraft.server.permissions.PermissionSet net.minecraft.server.permissions.Permissions net.minecraft.server.permissions.PermissionLevel net.minecraft.world.level.storage.LevelResource || true
          javap -p -classpath nf.jar 'net.neoforged.neoforge.client.event.RenderGuiEvent' || true
          curl -fsSL https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar -o game262.jar
          javap -p -classpath game262.jar net.minecraft.world.entity.decoration.painting.Painting net.minecraft.server.level.ServerPlayer net.minecraft.server.players.PlayerList net.minecraft.client.multiplayer.ClientLevel net.minecraft.client.renderer.OrderedSubmitNodeCollector net.minecraft.client.renderer.rendertype.RenderTypes || true
