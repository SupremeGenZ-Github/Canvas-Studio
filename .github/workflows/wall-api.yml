name: Inspect wall painting APIs
on:
  push:
    branches: [studio-3.1]
    paths: ['.github/workflows/wall-api.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect official game classes
        run: |
          curl -fsSL https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar -o minecraft.jar
          javap -p -classpath minecraft.jar net.minecraft.world.entity.decoration.ItemFrame net.minecraft.world.entity.decoration.HangingEntity 'net.minecraft.world.entity.EntityType$Builder' net.minecraft.world.entity.player.Player > wall-api.txt
          cat wall-api.txt
          javap -c -p -classpath minecraft.jar net.minecraft.world.entity.decoration.ItemFrame > wall-bytecode.txt
          python3 - <<'PY'
          from pathlib import Path
          for block in Path('wall-bytecode.txt').read_text().split('\n\n'):
              if any(name in block.split('\n')[0] for name in ['hurtServer(', 'dropItem(', 'getFrameItemStack(', 'ItemFrame(']):
                  print(block)
          PY
