name: Build and publish Canvas Studio+ 2.1.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        run: grep -q "version = '2.1.1'" build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon | tee verification/build-2.1.1.log
          python3 verification/ArtifactChecks.py | tee verification/artifact-2.1.1.log
      - name: Package release
        run: |
          python3 - <<'PY'
          import os, hashlib, subprocess, zipfile
          from pathlib import Path
          root=Path('.')
          jar=root/'build/libs/canvas-studio-plus-26.3-2.1.1.jar'
          digest=hashlib.sha256(jar.read_bytes()).hexdigest()
          run=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          report=root/'VALIDATION.md'
          report.write_text(report.read_text()+f'\n## Executed release result\n\n**PASS** — clean Gradle build, all seven Java verification suites and packaged artifact checks.\n\nRun: {run}\n\nJAR SHA-256: `{digest}`\n\nInteractive in-game testing: **none**.\n')
          assets=root/'assets';assets.mkdir()
          (assets/jar.name).write_bytes(jar.read_bytes())
          for p in [report,root/'verification/build-2.1.1.log',root/'verification/artifact-2.1.1.log']:(assets/p.name).write_bytes(p.read_bytes())
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          extra=['verification/build-2.1.1.log','verification/artifact-2.1.1.log']
          with zipfile.ZipFile(assets/'Canvas-Studio-Plus-2.1.1-source.zip','w',zipfile.ZIP_DEFLATED) as z:
           for name in dict.fromkeys(tracked+extra):
            if name and not name.startswith('release-assets/') and Path(name).is_file():z.write(name,'Canvas-Studio-Plus-2.1.1/'+name)
          (assets/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(assets.iterdir()) if p.is_file()))
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v2.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v2.1.1 assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Canvas Studio+ 2.1.1 — Molten progression' --notes-file docs/releases/v2.1.1.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-studio-2.1.1-validation
          path: |
            assets/*
            verification/build-2.1.1.log
            verification/artifact-2.1.1.log
